name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  last-versions:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 7
      matrix:
        include:
          - python-version: "3.10"
            toxenv: py310-django{2.1,2.2,3.0,3.1,3.2}
          - python-version: "3.10"
            toxenv: py310-django{2.1,2.2}-deprecated.social.auth,syntax
          - python-version: "3.11"
            toxenv: py311-django{2.2,3.0,3.1,3.2}
          - python-version: "3.11"
            toxenv: py311-django{4.0,4.1,4.2,5.0,5.1,5.2}
          - python-version: "3.11"
            toxenv: py311-django{2.2,3.0,3.1,3.2}-deprecated.social.auth
          - python-version: "3.12"
            toxenv: py312-django{4.0,4.1,4.2}
          - python-version: "3.12"
            toxenv: py312-django{5.0,5.1,5.2,6.0,6.1}

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools "tox<4"
    - name: Checkout
      uses: actions/checkout@v3
    - name: Run Tests
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: |
        tox
