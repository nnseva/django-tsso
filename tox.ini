  django4.2: social-auth-app-django<6
  django5.0: django>=5.0,<5.1
  django5.0: social-auth-app-django<6
  django5.1: django>=5.1,<5.2
  django5.1: social-auth-app-django<6
  django5.2: django>=5.2,<5.3
  django5.2: social-auth-app-django<6
  django6.0: django>=6.0,<6.1
